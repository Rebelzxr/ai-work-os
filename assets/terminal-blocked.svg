<text x="28" y="80" font-family="SF Mono,Menlo,Consolas,monospace" font-size="16" fill="#9a9c92" xml:space="preserve"># the agent tries a force push</text>
<text x="28" y="106" font-family="SF Mono,Menlo,Consolas,monospace" font-size="16" fill="#f87171" xml:space="preserve">BLOCKED (force push): git push --force origin main</text>
<text x="28" y="132" font-family="SF Mono,Menlo,Consolas,monospace" font-size="16" fill="#ece9e0" xml:space="preserve">This needs the human&#x27;s explicit approval for the exact command.</text>
