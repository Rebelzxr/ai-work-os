<text x="28" y="366" font-family="SF Mono,Menlo,Consolas,monospace" font-size="16" fill="#ece9e0" xml:space="preserve">  1. Open ~/my-work/AGENTS.md and fill in the &lt;angle brackets&gt; (5 minutes).</text>
